    <!-- Main Content -->
    <main class="main-wrapper">
      <header class="top-bar">
        <div class="top-bar-title">
          <h2>Bảng điểm chi tiết & Điểm tích lũy</h2>
        </div>
        <div class="top-bar-actions">
          <button id="btn-add-course" class="btn btn-primary btn-sm">➕ Thêm môn học thủ công</button>
        </div>
      </header>

      <div class="content-container">

        <!-- Semester Filter Controls -->
        <div class="grades-controls">
          <div id="semester-tabs" class="semester-tabs">
            <!-- Rendered dynamically by JS -->
          </div>
        </div>

        <!-- Detailed Transcript Semester Cards Container -->
        <div id="grades-container" class="grades-container">
          <!-- Rendered dynamically by JS -->
        </div>

      </div>
    </main>

  </div>

  <!-- Course Add/Edit Modal Dialog -->
  <div id="course-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title-text" class="modal-title">Thêm môn học</h3>
        <button id="btn-close-modal" class="btn btn-secondary btn-sm" style="padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <form id="course-form">
        <input type="hidden" id="course-id">

        <div class="form-group">
          <label class="form-label">Tên môn học *</label>
          <input type="text" id="course-name" class="form-input" placeholder="Ví dụ: Cấu trúc dữ liệu và giải thuật"
            required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Mã môn học</label>
            <input type="text" id="course-code" class="form-input" placeholder="Ví dụ: 110005">
          </div>
          <div class="form-group">
            <label class="form-label">Số tín chỉ</label>
            <input type="number" id="course-credits" class="form-input" min="1" max="15" value="3" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Điểm Chữ</label>
            <select id="course-letter" class="form-select">
              <option value="A">A (4.0)</option>
              <option value="B+">B+ (3.5)</option>
              <option value="B" selected>B (3.0)</option>
              <option value="C+">C+ (2.5)</option>
              <option value="C">C (2.0)</option>
              <option value="D+">D+ (1.5)</option>
              <option value="D">D (1.0)</option>
              <option value="F">F (0.0 - Nợ môn)</option>
              <option value="M">M (Miễn HP - Không tính GPA)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Điểm Hệ 10 (Tùy chọn)</label>
            <input type="number" id="course-score10" class="form-input" step="0.1" min="0" max="10" placeholder="8.5">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Học kỳ</label>
          <input type="text" id="course-semester" class="form-input" placeholder="Học kỳ 1 - 2023-2024"
            value="Học kỳ 1">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary">Lưu thông tin</button>
        </div>
      </form>
    </div>
  </div>
